name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Install and verify ripgrep
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ripgrep
          command -v rg
          rg --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm run test:integration:fixture
      - run: pnpm run test:unit
